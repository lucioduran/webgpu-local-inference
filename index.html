<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local ticket inference</title>
  <style>
    body {
      font: 18px system-ui;
      background: #101a24;
      color: #e5f1f3;
      max-width: 900px;
      margin: 4rem auto;
      padding: 1rem;
    }
    h1 {
      font-size: 3rem;
    }
    textarea {
      width: 95%;
      min-height: 90px;
      font: inherit;
      padding: 1rem;
    }
    button,
    select {
      font: inherit;
      padding: 0.7rem;
      margin: 0.4rem 0;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #1c2b38;
      padding: 1rem;
    }
    a {
      color: #8de1dc;
    }
    .note {
      color: #aabfc8;
    }
  </style>
  <h1>Local ticket inference</h1>
  <p>
    Route a short support ticket to billing, access or delivery. Processing
    stays in this browser.
  </p>
  <p class="note">
    Small synthetic-data model. Suggestions need human review. Unrecognized
    vocabulary returns unknown.
  </p>
  <label for="text">Ticket</label
  ><br />
  <textarea id="text">Please refund the duplicate payment</textarea
  ><br />
  <label for="backend">Compute backend</label>
  <select id="backend">
    <option value="auto">Automatic</option>
    <option value="webgpu">WebGPU required</option>
    <option value="wasm">WebAssembly</option>
  </select>
  <button id="predict">Classify ticket</button>
  <button id="cancel">Cancel</button>
  <button id="cache">Cache for offline use</button>
  <button id="benchmark">Run fixed browser evaluation</button>
  <pre id="status" role="status">
Ready. Model downloads only from this local server.</pre
  >
  <script type="module" src="/src/app.js"></script>
</html>
