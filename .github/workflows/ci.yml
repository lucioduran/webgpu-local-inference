name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format
      - run: npm run build
      - run: git diff --exit-code -- public
      - run: npm run check
      - run: npm test
      - run: npm run replay
      - run: npm run smoke
